<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white font-sans">

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex w-64 h-screen fixed p-6 border-r border-[#282828] flex-col">
        <h1 class="text-xl font-bold mb-10">JOHN MUSIC</h1>
        <nav class="space-y-6 text-gray-400">
            <a href="home.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="home"></i> Home</a>
            <a href="search.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="search"></i> Search</a>
            <a href="profile.html" class="flex items-center gap-4 text-white"><i data-lucide="user"></i> Profile</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 p-6 pb-24">
        <h2 class="text-2xl font-bold mb-8">Profile</h2>
        
        <div class="bg-[#121212] p-8 rounded-2xl max-w-sm">
            <div class="text-gray-400 mb-4"><i data-lucide="user-circle" class="w-16 h-16"></i></div>
            <h3 class="text-xl font-bold">John</h3>
            <p class="text-gray-500 mb-6">john@example.com</p>
            
            <button id="logout-btn" class="w-full text-left p-3 border border-red-900 text-red-500 rounded-lg hover:bg-red-900 transition">
                Log Out
            </button>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 w-full bg-[#121212] border-t border-[#282828] flex justify-around p-4">
        <a href="home.html" class="text-gray-400 hover:text-white"><i data-lucide="home"></i></a>
        <a href="search.html" class="text-gray-400 hover:text-white"><i data-lucide="search"></i></a>
        <a href="profile.html" class="text-white hover:text-white"><i data-lucide="user"></i></a>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
