<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] text-white font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[#121212] p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-2xl font-bold mb-10 tracking-tighter">JOHN MUSIC</h1>
                <nav class="space-y-4 text-gray-400">
                    <a href="home.html" class="block hover:text-white transition">Home</a>
                    <a href="search.html" class="block hover:text-white transition">Search</a>
                    <a href="profile.html" class="block text-white transition">Profile</a>
                    <a href="admin.html" class="block text-red-500 hover:text-red-400 transition">Admin Panel</a>
                </nav>
            </div>
            <button id="logout-btn" class="text-gray-500 hover:text-white text-sm">Log Out</button>
        </aside>

        <!-- Profile Content -->
        <main class="flex-1 p-10 overflow-y-auto">
            <h2 class="text-3xl font-bold mb-10">Your Profile</h2>
            
            <div class="bg-[#121212] p-8 rounded-3xl max-w-lg border border-[#1f1f1f]">
                <div class="w-24 h-24 bg-gray-700 rounded-full mb-6 flex items-center justify-center text-4xl">👤</div>
                <h3 id="user-name" class="text-2xl font-bold">John</h3>
                <p id="user-email" class="text-gray-400 mb-8">john@example.com</p>
                
                <div class="space-y-4">
                    <button class="w-full text-left p-4 bg-[#1f1f1f] rounded-xl hover:bg-[#282828] transition">Edit Profile</button>
                    <button class="w-full text-left p-4 bg-[#1f1f1f] rounded-xl hover:bg-[#282828] transition">Account Settings</button>
                    <button class="w-full text-left p-4 bg-[#1f1f1f] rounded-xl text-red-500 hover:bg-[#282828] transition">Delete Account</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDT8_4rWDSCs0mC18XpiqBMEc7YAIuJ6Y0",
            authDomain: "myspotify-5966c.firebaseapp.com",
            projectId: "myspotify-5966c",
            storageBucket: "myspotify-5966c.firebasestorage.app",
            messagingSenderId: "597187457714",
            appId: "1:597187457714:web:eb2775082dd45109608fab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email;
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
