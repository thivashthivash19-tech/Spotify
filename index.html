<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Sign Up | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0A0A0A] text-white flex items-center justify-center h-screen">

    <div class="bg-[#121212] p-10 rounded-3xl w-full max-w-sm border border-[#1f1f1f]">
        <h1 id="title" class="text-2xl font-bold text-center mb-8">Sign In</h1>
        
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-[#1f1f1f] rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-[#1f1f1f] rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
            <button id="auth-btn" class="w-full bg-white text-black font-bold py-4 rounded-full">Sign In</button>
        </div>

        <p class="mt-6 text-center text-sm">
            <span id="toggle-text" class="text-gray-400">Don't have an account?</span> 
            <span id="toggle-btn" class="text-green-500 cursor-pointer hover:underline">Sign Up</span>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDT8_4rWDSCs0mC18XpiqBMEc7YAIuJ6Y0",
            authDomain: "myspotify-5966c.firebaseapp.com",
            projectId: "myspotify-5966c",
            storageBucket: "myspotify-5966c.firebasestorage.app",
            messagingSenderId: "597187457714",
            appId: "1:597187457714:web:eb2775082dd45109608fab"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let isLogin = true;

        // Toggle UI
        document.getElementById('toggle-btn').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Sign In" : "Sign Up";
            document.getElementById('auth-btn').innerText = isLogin ? "Sign In" : "Sign Up";
            document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-btn').innerText = isLogin ? "Sign Up" : "Log In";
        });

        // Auth Logic
        document.getElementById('auth-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = "home.html";
            } catch (err) {
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
