<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white font-sans">

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 w-full bg-[#121212] border-t border-[#282828] flex justify-around p-4 z-50">
        <a href="home.html" class="text-gray-400 hover:text-white"><i data-lucide="home"></i></a>
        <a href="search.html" class="text-gray-400 hover:text-white"><i data-lucide="search"></i></a>
        <a href="profile.html" class="text-gray-400 hover:text-white"><i data-lucide="user"></i></a>
    </nav>

    <main class="p-8 max-w-2xl mx-auto pb-24">
        <h2 class="text-3xl font-bold mb-8 text-red-500">Admin Upload 🛡️</h2>
        
        <div class="bg-[#121212] p-8 rounded-2xl border border-[#282828] space-y-6">
            <!-- Song Name -->
            <div>
                <label class="block text-sm text-gray-400 mb-2">Song Title</label>
                <input type="text" id="title" placeholder="Enter song name" class="w-full p-4 bg-[#1f1f1f] rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <!-- Choose Audio File -->
            <div>
                <label class="block text-sm text-gray-400 mb-2">Select Audio File</label>
                <input type="file" id="audio-input" accept="audio/*" class="w-full p-4 bg-[#1f1f1f] rounded-xl cursor-pointer">
            </div>

            <!-- Choose Image File -->
            <div>
                <label class="block text-sm text-gray-400 mb-2">Select Cover Image</label>
                <input type="file" id="image-input" accept="image/*" class="w-full p-4 bg-[#1f1f1f] rounded-xl cursor-pointer">
            </div>

            <button id="save-btn" class="w-full bg-red-600 hover:bg-red-700 font-bold py-4 rounded-xl transition">
                Upload & Save
            </button>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Base64 converter function
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const title = document.getElementById('title').value;
            const audioFile = document.getElementById('audio-input').files[0];
            const imageFile = document.getElementById('image-input').files[0];

            if (!title || !audioFile || !imageFile) {
                alert("Ellathaiyum fill pannunga!");
                return;
            }

            // Processing files
            const audioData = await toBase64(audioFile);
            const imageData = await toBase64(imageFile);

            const songData = { title, audio: audioData, image: imageData };
            
            // Saving to LocalStorage
            let songs = JSON.parse(localStorage.getItem('mySongs') || "[]");
            songs.push(songData);
            localStorage.setItem('mySongs', JSON.stringify(songs));
            
            alert("Song successfully added!");
            
            // Clearing inputs
            document.getElementById('title').value = '';
            document.getElementById('audio-input').value = '';
            document.getElementById('image-input').value = '';
        });
    </script>
</body>
</html>
