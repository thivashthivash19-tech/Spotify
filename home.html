<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white font-sans">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#000000] p-6 border-r border-[#282828]">
            <h1 class="text-xl font-bold mb-10">JOHN MUSIC</h1>
            <nav class="space-y-6 text-gray-400">
                <a href="home.html" class="flex items-center gap-4 hover:text-white transition">
                    <i data-lucide="home"></i> Home
                </a>
                <a href="search.html" class="flex items-center gap-4 hover:text-white transition">
                    <i data-lucide="search"></i> Search
                </a>
                <a href="profile.html" class="flex items-center gap-4 hover:text-white transition">
                    <i data-lucide="user"></i> Profile
                </a>
                <a href="admin.html" class="flex items-center gap-4 text-red-500 hover:text-red-400">
                    <i data-lucide="shield-alert"></i> Admin
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10">
            <h2 class="text-2xl font-bold mb-8">Good evening, John</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#181818] p-6 rounded-lg hover:bg-[#282828] transition">
                    <h3 class="font-bold">Trending Now</h3>
                </div>
                <div class="bg-[#181818] p-6 rounded-lg hover:bg-[#282828] transition">
                    <h3 class="font-bold">Top Picks</h3>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Icons initialize panna
        lucide.createIcons();
    </script>
</body>
</html>
