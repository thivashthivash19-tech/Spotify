<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white font-sans">

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex w-64 h-screen fixed p-6 border-r border-[#282828] flex-col">
        <h1 class="text-xl font-bold mb-10">JOHN MUSIC</h1>
        <nav class="space-y-6 text-gray-400">
            <a href="home.html" class="flex items-center gap-4 text-white"><i data-lucide="home"></i> Home</a>
            <a href="search.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="search"></i> Search</a>
            <a href="profile.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="user"></i> Profile</a>
            <a href="admin.html" class="flex items-center gap-4 text-red-500 hover:text-red-400"><i data-lucide="shield-alert"></i> Admin</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 p-6 pb-24">
        <h2 class="text-2xl font-bold mb-8">Good evening, John</h2>
        
        <!-- Songs Grid -->
        <div id="songs-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Songs will be injected here by JavaScript -->
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 w-full bg-[#121212] border-t border-[#282828] flex justify-around p-4 z-50">
        <a href="home.html" class="text-white"><i data-lucide="home"></i></a>
        <a href="search.html" class="text-gray-400"><i data-lucide="search"></i></a>
        <a href="profile.html" class="text-gray-400"><i data-lucide="user"></i></a>
    </nav>

    <script>
        lucide.createIcons();

        // Load songs from Local Storage
        const songsContainer = document.getElementById('songs-grid');
        const storedSongs = JSON.parse(localStorage.getItem('mySongs') || "[]");

        if (storedSongs.length > 0) {
            storedSongs.forEach(song => {
                const songCard = `
                    <div class="bg-[#181818] p-4 rounded-xl hover:bg-[#282828] transition group">
                        <img src="${song.image}" class="w-full h-40 object-cover rounded-lg mb-4">
                        <h3 class="font-bold text-white truncate">${song.title}</h3>
                        <audio controls class="w-full mt-3 h-10 opacity-70 hover:opacity-100">
                            <source src="${song.audio}" type="audio/mp3">
                        </audio>
                    </div>
                `;
                songsContainer.innerHTML += songCard;
            });
        } else {
            songsContainer.innerHTML = "<p class='text-gray-500'>No songs uploaded yet! Go to Admin page.</p>";
        }
    </script>
</body>
</html>
