<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | John Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#000000] text-white font-sans">

    <aside class="hidden md:flex w-64 h-screen fixed p-6 border-r border-[#282828] flex-col">
        <h1 class="text-xl font-bold mb-10 text-green-500">JOHN MUSIC</h1>
        <nav class="space-y-6 text-gray-400">
            <a href="home.html" class="flex items-center gap-4 text-white"><i data-lucide="home"></i> Home</a>
            <a href="search.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="search"></i> Search</a>
            <a href="profile.html" class="flex items-center gap-4 hover:text-white"><i data-lucide="user"></i> Profile</a>
            <a href="admin.html" class="flex items-center gap-4 text-red-500"><i data-lucide="shield-alert"></i> Admin</a>
        </nav>
    </aside>

    <main class="md:ml-64 p-6 pb-24">
        <h2 class="text-2xl font-bold mb-6">Latest Hits</h2>
        <div id="latest-grid" class="grid grid-cols-2 md:grid-cols-5 gap-6 mb-12">
            </div>

        <h2 class="text-2xl font-bold mb-6">Your Collection</h2>
        <div id="all-songs-list" class="space-y-4">
            </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-[#121212] border-t border-[#282828] flex justify-around p-4 z-50">
        <a href="home.html" class="text-white"><i data-lucide="home"></i></a>
        <a href="search.html" class="text-gray-400"><i data-lucide="search"></i></a>
        <a href="profile.html" class="text-gray-400"><i data-lucide="user"></i></a>
    </nav>

    <script>
        lucide.createIcons();

        const storedSongs = JSON.parse(localStorage.getItem('mySongs') || "[]");
        
        // 1. Latest 5 Grid (Last 5 items)
        const latestGrid = document.getElementById('latest-grid');
        const latest = storedSongs.slice(-5).reverse();
        
        latest.forEach(song => {
            latestGrid.innerHTML += `
                <div class="bg-[#181818] p-4 rounded-lg hover:bg-[#282828] transition cursor-pointer group">
                    <div class="relative mb-4">
                        <img src="${song.image}" class="w-full aspect-square object-cover rounded-md">
                        <div class="absolute bottom-2 right-2 bg-green-500 p-3 rounded-full opacity-0 group-hover:opacity-100 transition shadow-lg">
                            <i data-lucide="play" class="text-black fill-black"></i>
                        </div>
                    </div>
                    <h3 class="font-bold truncate">${song.title}</h3>
                </div>
            `;
        });

        // 2. All Songs List
        const allList = document.getElementById('all-songs-list');
        storedSongs.forEach(song => {
            allList.innerHTML += `
                <div class="flex items-center gap-4 bg-[#121212] p-3 rounded-lg hover:bg-[#282828] transition">
                    <img src="${song.image}" class="w-12 h-12 rounded object-cover">
                    <h3 class="flex-1 font-medium">${song.title}</h3>
                    <i data-lucide="play" class="w-5 h-5 cursor-pointer text-gray-400 hover:text-white"></i>
                </div>
            `;
        });
        
        lucide.createIcons();
    </script>
</body>
</html>
